<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyesiga Nursing and Home Care Services | Professional Nursing &amp; Home Care</title>
<meta name="description" content="Nyesiga Nursing and Home Care Services provides compassionate, professional and personalized bedside nursing and home-care support for individuals and families.">
<meta name="keywords" content="bedside nursing, home care, elderly care, post-hospitalization care, personal care assistance, respite care, in-home nursing">
<meta property="og:title" content="Nyesiga Nursing and Home Care Services">
<meta property="og:description" content="Professional Nursing Care. Comfort of Home.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2D52;
    --navy-deep:#0A1F3D;
    --teal:#1E8A73;
    --teal-light:#E4F3EF;
    --blue-soft:#EAF2FB;
    --gray-bg:#F6F8FA;
    --white:#FFFFFF;
    --ink:#1B2634;
    --muted:#5B6472;
    --line:#E3E7EC;
    --radius:16px;
    --shadow:0 18px 40px -26px rgba(15,45,82,0.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--white);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;line-height:1.15;color:var(--navy-deep);}
  a{text-decoration:none;color:inherit;}
  img{max-width:100%;display:block;}
  button,input,select,textarea{font-family:inherit;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
  :focus-visible{outline:3px solid var(--teal);outline-offset:3px;}
  .eyebrow{font-size:0.78rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--teal);}
  .muted{color:var(--muted);}
  section.pad{padding:72px 0;}
  section.pad.gray{background:var(--gray-bg);}
  .section-head{max-width:680px;margin-bottom:40px;}
  .section-head h2{font-size:clamp(1.7rem,3vw,2.4rem);margin-top:10px;}
  .section-head p{margin-top:14px;font-size:1.02rem;color:var(--muted);}
  .placeholder{border-bottom:1.5px dashed var(--teal);padding-bottom:1px;}

  /* Buttons */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:14px 26px;border-radius:100px;font-weight:700;font-size:0.95rem;
    border:none;cursor:pointer;transition:transform .15s, box-shadow .15s, background .15s;
  }
  .btn-primary{background:var(--teal);color:var(--white);}
  .btn-primary:hover{background:#177A66;box-shadow:0 12px 24px -10px rgba(30,138,115,0.5);}
  .btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--navy-deep);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-navy{background:var(--navy);color:var(--white);}
  .btn-navy:hover{background:var(--navy-deep);}

  /* Header / Nav */
  header{
    position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  }
  nav.wrap{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;gap:20px;}
  .brand{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .brand-mark{
    width:46px;height:46px;border-radius:50%;background:var(--white);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    overflow:hidden;border:1.5px solid var(--line);
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
  .footer-logo{
    width:64px;height:64px;border-radius:16px;background:var(--white);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;
  }
  .footer-logo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
  .brand-name{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:1rem;color:var(--navy-deep);line-height:1.2;}
  .brand-name span{display:block;font-size:0.68rem;font-weight:600;color:var(--teal);letter-spacing:0.03em;}
  .navlinks{display:flex;gap:2px;align-items:center;flex-wrap:wrap;}
  .navlinks button{
    background:none;border:none;cursor:pointer;font-size:0.86rem;font-weight:600;
    color:var(--ink);opacity:0.7;padding:9px 12px;border-radius:100px;transition:all .2s;
    white-space:nowrap;
  }
  .navlinks button:hover{opacity:1;background:var(--blue-soft);}
  .navlinks button.active{opacity:1;background:var(--navy);color:var(--white);}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .mobile-toggle{display:none;background:none;border:none;font-size:1.6rem;cursor:pointer;color:var(--navy);}

  @media (max-width:1080px){
    .navlinks{
      position:absolute;top:100%;left:0;right:0;background:var(--white);
      flex-direction:column;align-items:stretch;padding:12px 20px 20px;
      border-bottom:1px solid var(--line);display:none;box-shadow:var(--shadow);
    }
    .navlinks.open{display:flex;}
    .navlinks button{text-align:left;}
    .mobile-toggle{display:block;}
    .nav-right .btn-primary{display:none;}
  }

  /* PAGES */
  .page{display:none;}
  .page.active{display:block;animation:fadein .45s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* HERO */
  .hero{padding:70px 0 60px;background:linear-gradient(180deg,var(--blue-soft) 0%, var(--white) 100%);}
  .hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:50px;align-items:center;}
  .hero h1{font-size:clamp(2.1rem,4vw,3.1rem);margin:14px 0 18px;}
  .hero h1 .accent{color:var(--teal);}
  .hero p.lede{font-size:1.08rem;color:var(--muted);max-width:48ch;margin-bottom:28px;}
  .hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:40px;}
  .photo-block{
    position:relative;border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(150deg,var(--navy) 0%, var(--teal) 100%);
    aspect-ratio:4/3.1;box-shadow:var(--shadow);
    display:flex;align-items:flex-end;padding:26px;color:var(--white);
  }
  .photo-block .cap{position:relative;z-index:2;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:1rem;max-width:26ch;}
  .photo-block::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 75% 15%, rgba(255,255,255,0.18), transparent 55%);}
  .photo-icon{position:absolute;top:22px;right:22px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;z-index:2;}

  .trust-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .trust-item{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;text-align:center;
  }
  .trust-item .ic{width:40px;height:40px;border-radius:50%;background:var(--teal-light);color:var(--teal);
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:1.1rem;}
  .trust-item b{display:block;font-size:0.9rem;font-family:'Plus Jakarta Sans',sans-serif;}

  /* Cards / grids */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;transition:transform .2s, box-shadow .2s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .card .ic{width:46px;height:46px;border-radius:12px;background:var(--teal-light);color:var(--teal);
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:1.25rem;}
  .card h3{font-size:1.05rem;margin-bottom:8px;}
  .card p{font-size:0.92rem;color:var(--muted);}
  .card .learn{display:inline-block;margin-top:14px;font-size:0.85rem;font-weight:700;color:var(--teal);}

  /* Process / timeline */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:step;}
  .step{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;position:relative;}
  .step-num{
    width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--white);
    display:flex;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
    margin-bottom:16px;font-size:0.95rem;
  }
  .step h3{font-size:1rem;margin-bottom:6px;}
  .step p{font-size:0.88rem;color:var(--muted);}

  .steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}

  /* Values */
  .value-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .value-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
  .value-card h3{font-size:1rem;margin-bottom:6px;color:var(--teal);}
  .value-card p{font-size:0.9rem;color:var(--muted);}

  /* Testimonials */
  .test-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
  .test-card .stars{color:var(--teal);margin-bottom:12px;letter-spacing:2px;}
  .test-card p.quote{font-size:0.93rem;color:var(--ink);font-style:italic;margin-bottom:14px;}
  .test-name{font-weight:700;font-size:0.88rem;}
  .test-role{font-size:0.78rem;color:var(--muted);}

  /* FAQ Accordion */
  .accordion{max-width:820px;}
  .acc-item{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--white);}
  .acc-q{
    width:100%;text-align:left;padding:18px 20px;background:none;border:none;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    font-weight:700;font-size:0.96rem;color:var(--navy-deep);
  }
  .acc-q .plus{transition:transform .25s;color:var(--teal);font-size:1.3rem;flex-shrink:0;}
  .acc-item.open .acc-q .plus{transform:rotate(45deg);}
  .acc-a{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .acc-a-inner{padding:0 20px 18px;font-size:0.9rem;color:var(--muted);}

  /* Forms */
  form.card-form{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  label{font-size:0.82rem;font-weight:700;display:block;margin-bottom:6px;color:var(--navy-deep);}
  input,select,textarea{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);
    font-size:0.94rem;background:var(--gray-bg);color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;background:var(--white);}
  textarea{resize:vertical;min-height:90px;}
  .full{grid-column:1/-1;}
  .form-note{font-size:0.78rem;color:var(--muted);margin-top:12px;}
  .success-box{
    display:none;text-align:center;padding:40px 20px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--teal-light);
  }
  .success-box.show{display:block;}
  .success-box .ic{width:56px;height:56px;border-radius:50%;background:var(--teal);color:var(--white);
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.5rem;}
  .invalid{border-color:#C0392B !important;}

  /* Contact info */
  .contact-info-item{display:flex;gap:16px;padding:18px 0;border-top:1px solid var(--line);}
  .contact-info-item:first-child{border-top:none;}
  .contact-info-item .ic{width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--white);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .contact-info-item b{display:block;font-size:0.94rem;}
  .contact-info-item span{font-size:0.88rem;color:var(--muted);}

  /* Disclaimer box */
  .disclaimer{
    background:var(--blue-soft);border-left:4px solid var(--navy);border-radius:10px;
    padding:18px 20px;font-size:0.88rem;color:var(--navy-deep);margin-top:30px;
  }

  /* CTA band */
  .cta-band{background:var(--navy);border-radius:24px;padding:48px 40px;color:var(--white);
    display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;}
  .cta-band h2{color:var(--white);font-size:1.6rem;}
  .cta-band p{color:#CBD9EA;margin-top:6px;}

  /* Footer */
  footer{background:var(--navy-deep);color:#C7D2E0;padding:56px 0 26px;margin-top:20px;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;margin-bottom:36px;}
  footer h4{color:var(--white);font-size:1rem;margin-bottom:14px;}
  footer p{font-size:0.86rem;max-width:32ch;color:#A9B7CB;}
  footer ul{list-style:none;}
  footer ul li{margin-bottom:9px;}
  footer ul a{font-size:0.86rem;}
  footer ul a:hover{color:var(--teal);}
  .footer-bottom{
    border-top:1px solid rgba(255,255,255,0.12);padding-top:20px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:0.78rem;color:#8595AC;
  }
  .footer-bottom a{margin-left:14px;}

  /* Floating buttons */
  .float-btn{
    position:fixed;right:22px;z-index:200;width:56px;height:56px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;
    box-shadow:0 14px 28px -10px rgba(0,0,0,0.35);color:var(--white);font-size:1.4rem;
  }
  .whatsapp-btn{bottom:22px;background:#25D366;}
  .top-btn{bottom:90px;background:var(--navy);opacity:0;pointer-events:none;transition:opacity .25s;}
  .top-btn.show{opacity:1;pointer-events:auto;}

  @media (max-width:900px){
    .hero-grid,.grid2,.value-grid{grid-template-columns:1fr;}
    .grid3,.trust-row,.steps{grid-template-columns:1fr 1fr;}
    .steps5{grid-template-columns:1fr 1fr;}
    .footer-grid{grid-template-columns:1fr 1fr;}
    .cta-band{flex-direction:column;text-align:center;}
  }
  @media (max-width:600px){
    .grid3,.trust-row,.steps,.steps5,.form-row{grid-template-columns:1fr;}
    .footer-grid{grid-template-columns:1fr;}
    section.pad{padding:52px 0;}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .page.active{animation:none;}
    .card:hover{transform:none;}
  }
</style>
</head>
